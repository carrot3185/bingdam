<main><h1>삭제된 11초 · Qwen 턴어라운드</h1><p>최종 캐스팅: 서윤 첫 번째(A) · 도현 네 번째(D) · 지수 두 번째(B)<br>각 원본을 Qwen-Image 2.1 Edit에 입력해 만든 4방향 전신 시트 · 1536×1024<br>시트 순서: 정면 → 왼쪽을 향한 측면 → 후면 → 오른쪽을 향한 측면</p>

<dialog id="zoom"><button onclick="zoom.close()">닫기</button><img id="large" alt="턴어라운드 확대"></dialog><script>document.querySelectorAll('.sheet').forEach(img=>img.addEventListener('click',()=>{document.getElementById('large').src=img.src;document.getElementById('zoom').showModal()}));document.getElementById('zoom').addEventListener('click',e=>{if(e.target.id==='zoom')e.target.close()});</script></html>
